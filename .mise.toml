[tools]
node = "22"
pnpm = "10"
python = "3.12"
"npm:aws-cdk" = "2.1033.0"

[env]
_.file = ".env.local"
NODE_OPTIONS = "--max-old-space-size=8192"
_.path = ["./node_modules/.bin"]

[tasks.setup]
description = "Create .env.local configuration"
run = """
#!/usr/bin/env bash
if [ -f .env.local ]; then
  echo "Current .env.local:"
  cat .env.local
  echo ""
  read -p "Overwrite? (y/N): " overwrite
  [[ "$overwrite" =~ ^[yY]$ ]] || exit 0
fi

# AWS Profile
profiles=$(aws configure list-profiles 2>/dev/null)
if [ -n "$profiles" ] && command -v fzf &>/dev/null; then
  echo "Select AWS profile:"
  profile=$(echo "$profiles" | fzf --prompt="AWS_PROFILE: ")
else
  read -p "AWS_PROFILE [default]: " profile
  profile=${profile:-default}
fi

# AWS Region
regions="ap-northeast-2\nus-east-1\nus-west-2\nap-northeast-1\neu-west-1"
if command -v fzf &>/dev/null; then
  region=$(echo -e "$regions" | fzf --prompt="AWS_REGION: ")
else
  read -p "AWS_REGION [ap-northeast-2]: " region
  region=${region:-ap-northeast-2}
fi

cat > .env.local << EOF
AWS_REGION=$region
AWS_PROFILE=$profile
EOF

echo ""
echo "Created .env.local:"
cat .env.local
"""

[tasks.deploy]
description = "Deploy all CDK stacks"
run = """
set -e
pnpm install
pnpm nx run @aws-ocr-vision-lab/common-constructs:compile
pnpm nx run @aws-ocr-vision-lab/frontend:bundle:production
pnpm nx run @aws-ocr-vision-lab/infra:deploy --output-style=stream -- --all

# 2-pass: the Identity stack is created before the Frontend stack, so it can't
# know the CloudFront domain on the first pass. Read the deployed domain and
# re-deploy Identity so Cognito accepts it as a callback/logout URL (otherwise
# login fails with redirect_mismatch). Idempotent — a no-op once wired.
REGION="${AWS_REGION:-${CDK_DEFAULT_REGION:-ap-northeast-2}}"
FRONTEND_DOMAIN=$(aws cloudformation describe-stacks \
  --stack-name AwsOcrLab-Frontend --region "$REGION" \
  --query "Stacks[0].Outputs[?contains(OutputKey,'DistributionDomainName')].OutputValue | [0]" \
  --output text 2>/dev/null || echo "")
if [ -n "$FRONTEND_DOMAIN" ] && [ "$FRONTEND_DOMAIN" != "None" ]; then
  echo "Wiring CloudFront domain into Cognito callbacks: $FRONTEND_DOMAIN"
  pnpm nx run @aws-ocr-vision-lab/infra:deploy --output-style=stream -- \
    AwsOcrLab-Identity --require-approval never \
    --context frontendDomain="$FRONTEND_DOMAIN"
fi
"""

[tasks."deploy:stack"]
description = "Deploy a specific CDK stack (fzf)"
run = """
pnpm install
pnpm nx run @aws-ocr-vision-lab/common-constructs:compile
pnpm nx run @aws-ocr-vision-lab/frontend:bundle:production
stack=$(echo "AwsOcrLab-Infra\nAwsOcrLab-Model\nAwsOcrLab-Identity\nAwsOcrLab-Endpoint\nAwsOcrLab-UnlimitedEndpoint\nAwsOcrLab-Api\nAwsOcrLab-Frontend" | fzf --prompt="Select stack: ")
pnpm nx run @aws-ocr-vision-lab/infra:deploy $stack --output-style=stream
"""

[tasks.dev]
description = "Run frontend dev server"
run = """
pnpm install
pnpm nx run @aws-ocr-vision-lab/frontend:serve
"""
